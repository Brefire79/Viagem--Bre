<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Ícone da viagem Orlando: castelo de conto de fadas com fogos e um avião,
       na paleta do app (tinta marinha, terracota, papel). Desenho original. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112E41"/>
      <stop offset="1" stop-color="#1E4763"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- Estrelas -->
  <g fill="#F7F1E4" opacity="0.85">
    <circle cx="86" cy="118" r="4"/>
    <circle cx="140" cy="72" r="3"/>
    <circle cx="420" cy="96" r="3.5"/>
    <circle cx="378" cy="140" r="2.5"/>
    <circle cx="66" cy="210" r="2.5"/>
    <circle cx="452" cy="200" r="3"/>
  </g>

  <!-- Fogos (terracota e papel) -->
  <g stroke-linecap="round" fill="none">
    <g transform="translate(150 120)" stroke="#DB8A63" stroke-width="7">
      <line x1="0" y1="-34" x2="0" y2="-16"/><line x1="0" y1="16" x2="0" y2="34"/>
      <line x1="-34" y1="0" x2="-16" y2="0"/><line x1="16" y1="0" x2="34" y2="0"/>
      <line x1="-24" y1="-24" x2="-12" y2="-12"/><line x1="12" y1="12" x2="24" y2="24"/>
      <line x1="24" y1="-24" x2="12" y2="-12"/><line x1="-12" y1="12" x2="-24" y2="24"/>
    </g>
    <g transform="translate(372 88)" stroke="#F2D2C0" stroke-width="6">
      <line x1="0" y1="-26" x2="0" y2="-12"/><line x1="0" y1="12" x2="0" y2="26"/>
      <line x1="-26" y1="0" x2="-12" y2="0"/><line x1="12" y1="0" x2="26" y2="0"/>
      <line x1="-18" y1="-18" x2="-9" y2="-9"/><line x1="9" y1="9" x2="18" y2="18"/>
      <line x1="18" y1="-18" x2="9" y2="-9"/><line x1="-9" y1="9" x2="-18" y2="18"/>
    </g>
  </g>

  <!-- Avião (glifo clássico, subindo para a direita) -->
  <g transform="translate(270 130) rotate(-20) scale(5.2)" fill="#F7F1E4">
    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
  </g>

  <!-- Castelo -->
  <g fill="#F7F1E4">
    <!-- Base / muralha -->
    <rect x="96" y="352" width="320" height="64" rx="6"/>
    <!-- Ameias -->
    <rect x="96" y="336" width="24" height="20"/><rect x="136" y="336" width="24" height="20"/>
    <rect x="352" y="336" width="24" height="20"/><rect x="392" y="336" width="24" height="20"/>
    <!-- Torres laterais -->
    <rect x="128" y="264" width="52" height="100" rx="4"/>
    <rect x="332" y="264" width="52" height="100" rx="4"/>
    <polygon points="124,268 154,196 184,268"/>
    <polygon points="328,268 358,196 388,268"/>
    <!-- Torre central -->
    <rect x="222" y="212" width="68" height="160" rx="4"/>
    <polygon points="216,216 256,124 296,216"/>
    <!-- Torres médias -->
    <rect x="186" y="292" width="34" height="80" rx="3"/>
    <rect x="292" y="292" width="34" height="80" rx="3"/>
    <polygon points="183,296 203,246 223,296"/>
    <polygon points="289,296 309,246 329,296"/>
  </g>

  <!-- Bandeira -->
  <line x1="256" y1="124" x2="256" y2="88" stroke="#F7F1E4" stroke-width="5" stroke-linecap="round"/>
  <polygon points="258,90 292,102 258,114" fill="#BC5A2E"/>

  <!-- Portão e janelas (terracota) -->
  <g fill="#BC5A2E">
    <path d="M232 416 V366 a24 24 0 0 1 48 0 V416 Z"/>
    <rect x="248" y="250" width="16" height="30" rx="8"/>
    <rect x="146" y="290" width="14" height="26" rx="7"/>
    <rect x="350" y="290" width="14" height="26" rx="7"/>
    <rect x="196" y="316" width="12" height="22" rx="6"/>
    <rect x="302" y="316" width="12" height="22" rx="6"/>
  </g>
</svg>
